<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How to measure gluteus circumference">
  <defs>
    <style>
      .skin { fill: #f4c9a1; }
      .teal { fill: #26a69a; }
    </style>
  </defs>
  <!-- left arm, full length -->
  <path class="skin" d="M14,25 L56,25 L52,275 C50,286 20,286 18,275 Z" />
  <!-- right arm, full length -->
  <path class="skin" d="M286,25 L244,25 L248,275 C250,286 280,286 282,275 Z" />
  <!-- shorts -->
  <path class="teal" d="M64,20 L236,20 L228,270 L72,270 Z" />
  <rect x="64" y="20" width="172" height="26" fill="#ffffff" />
  <line x1="150" y1="46" x2="150" y2="270" stroke="#1c7d73" stroke-width="2" opacity="0.5" />
  <!-- tape lower than the hip illustration -->
  <rect x="56" y="140" width="188" height="20" rx="4" fill="#f6d94a" />
  <g stroke="#2e3646" stroke-width="2">
    <line x1="70" y1="140" x2="70" y2="160" />
    <line x1="86" y1="140" x2="86" y2="160" />
    <line x1="102" y1="140" x2="102" y2="160" />
    <line x1="118" y1="140" x2="118" y2="160" />
    <line x1="134" y1="140" x2="134" y2="160" />
    <line x1="150" y1="140" x2="150" y2="160" />
    <line x1="166" y1="140" x2="166" y2="160" />
    <line x1="182" y1="140" x2="182" y2="160" />
    <line x1="198" y1="140" x2="198" y2="160" />
    <line x1="214" y1="140" x2="214" y2="160" />
  </g>
  <rect x="224" y="140" width="10" height="20" rx="1.5" fill="#2e3646" />
</svg>
