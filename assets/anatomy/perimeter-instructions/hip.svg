<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How to measure hip circumference">
  <defs>
    <style>
      .skin { fill: #f4c9a1; }
      .teal { fill: #26a69a; }
    </style>
  </defs>
  <!-- left arm sliver -->
  <path class="skin" d="M18,30 L58,30 L58,270 L28,270 C22,270 18,260 18,250 Z" />
  <!-- right arm sliver -->
  <path class="skin" d="M282,30 L242,30 L242,270 L272,270 C278,270 282,260 282,250 Z" />
  <!-- shorts -->
  <path class="teal" d="M64,20 L236,20 L228,270 L72,270 Z" />
  <rect x="64" y="20" width="172" height="26" fill="#ffffff" />
  <line x1="150" y1="46" x2="150" y2="270" stroke="#1c7d73" stroke-width="2" opacity="0.5" />
  <!-- tape near top of shorts -->
  <rect x="56" y="66" width="188" height="20" rx="4" fill="#f6d94a" />
  <g stroke="#2e3646" stroke-width="2">
    <line x1="70" y1="66" x2="70" y2="86" />
    <line x1="86" y1="66" x2="86" y2="86" />
    <line x1="102" y1="66" x2="102" y2="86" />
    <line x1="118" y1="66" x2="118" y2="86" />
    <line x1="134" y1="66" x2="134" y2="86" />
    <line x1="150" y1="66" x2="150" y2="86" />
    <line x1="166" y1="66" x2="166" y2="86" />
    <line x1="182" y1="66" x2="182" y2="86" />
    <line x1="198" y1="66" x2="198" y2="86" />
    <line x1="214" y1="66" x2="214" y2="86" />
  </g>
  <rect x="224" y="66" width="10" height="20" rx="1.5" fill="#2e3646" />
</svg>
